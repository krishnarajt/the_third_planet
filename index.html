<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <title>The Third Planet — learn every country, flag and capital</title>
    <meta
      name="description"
      content="Point at the world until you know it. A zoomable map, 195 flags, and a reason to remember every one of them."
    />
    <meta name="theme-color" content="#0B2429" />

    <meta property="og:title" content="The Third Planet" />
    <meta property="og:description" content="Point at the world until you know it." />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installed-app chrome. apple-mobile-web-app-capable is the legacy
         spelling iOS still reads; mobile-web-app-capable is the standard one. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Third Planet" />
    <!-- iOS ignores the manifest icons and reads this one. It must be a PNG
         with no transparency: iOS composites it on black otherwise. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400;1,6..72,500&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
